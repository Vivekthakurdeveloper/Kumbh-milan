name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: kumbh_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kumbh_setu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kumbh_owner -d kumbh_setu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Cache face models and fixtures
        uses: actions/cache@v4
        with:
          path: |
            backend/models/faces
            backend/tests/fixtures/faces
          key: face-assets-v1-${{ hashFiles('backend/app/faces/models_fetch.py', 'backend/app/faces/fixtures_fetch.py') }}
      - name: Fetch face models and fixtures
        working-directory: backend
        run: |
          python -m app.cli fetch-face-models
          python -m app.cli fetch-face-fixtures
      - name: Compile
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://kumbh_owner:ci-only-password@127.0.0.1:5432/kumbh_setu_test
          TEST_REDIS_URL: redis://127.0.0.1:6380/15
          FACE_MODEL_DIR: models/faces
        run: python -m pytest -q
      - name: Schema drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://kumbh_owner:ci-only-password@127.0.0.1:5432/kumbh_setu_test
        run: python -m alembic check
