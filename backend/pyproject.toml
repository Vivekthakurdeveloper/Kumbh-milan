[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kumbh-setu-backend"
version = "0.1.0"
description = "Kumbh Setu Lost & Found case management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "boto3==1.35.90",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
    "redis==5.2.1",
    "prometheus-client==0.21.1",
    "numpy==2.2.1",
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "moto[s3]==5.0.24",
]
push = [
    "firebase-admin==6.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
